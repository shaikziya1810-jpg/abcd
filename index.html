<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrameFinder</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>FrameFinder</h1>
        <p>Find images that inspire you.</p>
    </header>

    <main>
        <form id="search-form">
            <label for="search-input" class="sr-only">
                Search images
            </label>

            <input
                type="search"
                id="search-input"
                placeholder="Search images..."
                autocomplete="off"
                required
            >

            <button type="submit" id="search-button">
                Search
            </button>
        </form>

        <div class="categories" aria-label="Image categories">
            <button type="button">Nature</button>
            <button type="button">Animals</button>
            <button type="button">Travel</button>
        </div>

        <p id="status" role="status" aria-live="polite">
            Search for something to get started.
        </p>

        <section
            id="results"
            aria-label="Image search results"
        >
            <p class="empty-message">
                Search for something to get started.
            </p>
        </section>
    </main>
</body>
</html>
